parameters:
  - name: target_run_id
    type: string
  - name: confirm_resume
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: overlay_mode
    type: string
  - name: run_workload
    type: boolean
  - name: source_state_build_id
    type: number
  - name: exclusive_modes
    type: boolean

jobs:
  - job: retained_worker_restart
    displayName: "Recover the exact unresponsive mesh96 worker without new capacity"
    variables:
      SCENARIO_NAME: clustermesh-scale
      CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      CLUSTERMESH_JOB_TIMEOUT_MINUTES: "60"
      CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: "30"
      SUITE_TOTAL_BUDGET_SECONDS: "0"
      AKS_CONTROL_PLANE_METRICS_ENABLED: "false"
    timeoutInMinutes: 60
    cancelTimeoutInMinutes: 30
    steps:
      - script: |
          set -euo pipefail
          jq -e '
            .target_run_id == "78751-f36f3d5a" and .confirm_resume == .target_run_id
            and .expected_subscription_id == "37deca37-c375-4a14-b90a-043849bd2bf1"
            and .expected_region == "eastus2euap" and .expected_cluster_count == 100
            and .tfvars_path == "scenarios/perf-eval/clustermesh-scale/terraform-inputs/azure-100-mock-shared.tfvars"
            and .overlay_mode == "resume-existing" and .run_workload == false
            and (.source_state_build_id | type == "number" and . > 0 and floor == .)
            and .exclusive_modes == true' <<< "$RESTART_SCOPE_JSON" >/dev/null
        displayName: "Require exclusive retained-worker restart scope"
        env:
          RESTART_SCOPE_JSON: ${{ convertToJson(parameters) }}

      - template: /steps/setup-tests.yml
        parameters:
          cloud: azure
          region: ${{ parameters.expected_region }}
          run_id: ${{ parameters.target_run_id }}
          credential_type: service_connection
          ssh_key_enabled: false

      - task: DownloadPipelineArtifact@2
        displayName: "Download the exact worker-state or pre-submit reservation evidence"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.source_state_build_id }}
          ${{ if eq(parameters.source_state_build_id, 79945) }}:
            artifactName: n100-retained-worker-restart-${{ parameters.source_state_build_id }}-1
          ${{ if ne(parameters.source_state_build_id, 79945) }}:
            artifactName: n100-unreachable-worker-recovery-${{ parameters.source_state_build_id }}-1
          targetPath: $(Pipeline.Workspace)/retained-worker-source

      - script: |
          set -euo pipefail
          umask 077
          directory="$ARTIFACT_DIRECTORY/n100-retained-worker-restart"
          mkdir -p "$directory"
          echo "##vso[task.setvariable variable=RETAINED_WORKER_DIAGNOSTICS_READY]true"
          cp -R "$SOURCE_DIRECTORY" "$directory/source-state"
          source="$directory/source-state"
          if find "$source" -type l -print -quit | grep -q .; then
            echo "Worker-state evidence must contain regular files, not symlinks." >&2
            exit 1
          fi
          prior_checkpoint=""
          prior_sha=""
          if [ "$SOURCE_STATE_BUILD_ID" = "79945" ]; then
            if [ ! -s "$source/recovery.json" ] || [ ! -d "$source/source-state" ]; then
              echo "The exact failed reservation and its immutable original observation are required." >&2
              exit 1
            fi
            cp "$source/recovery.json" "$directory/prior-reservation.json"
            prior_checkpoint="$directory/prior-reservation.json"
            prior_sha=$(sha256sum "$prior_checkpoint" | awk '{print $1}')
            source="$source/source-state"
          fi
          snapshot_hashes() {
            (cd "$source" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum --)
          }
          snapshot_hashes > "$directory/source-files.sha256"
          tfvars_sha=$(sha256sum "$REPOSITORY_DIRECTORY/$TFVARS_PATH" | awk '{print $1}')
          private=$(mktemp -d "$AGENT_TEMP_DIRECTORY/retained-worker-restart.XXXXXX")
          cleanup() {
            rm -f -- "$private/cluster.config"
            rmdir -- "$private"
          }
          trap cleanup EXIT
          timeout 90 az aks get-credentials --subscription "$SUBSCRIPTION" --resource-group "$RUN_ID" \
            --name clustermesh-96 --file "$private/cluster.config" --context clustermesh-96 --only-show-errors
          chmod 600 "$private/cluster.config"
          helper="$REPOSITORY_DIRECTORY/modules/python/clusterloader2/clustermesh-scale/stalled_retained_worker_recovery.py"
          args=(
            --resource-group "$RUN_ID" --confirm-resource-group "$CONFIRM_RESUME"
            --expected-subscription "$SUBSCRIPTION" --expected-region "$REGION"
            --expected-tfvars-sha "$tfvars_sha" --source-state-directory "$source"
            --kubeconfig "$private/cluster.config" --context clustermesh-96 --timeout-seconds 1800
          )
          if [ -n "$prior_checkpoint" ]; then
            args+=(--resume-checkpoint "$prior_checkpoint" --resume-build-id "$SOURCE_STATE_BUILD_ID")
          fi
          python3 -u "$helper" "${args[@]}" --summary-file "$directory/plan.json"
          jq -e '.execute == false and .mutation_started == false and .plan_valid == true' \
            "$directory/plan.json" >/dev/null
          snapshot_hashes > "$directory/source-files-after-plan.sha256"
          if ! cmp -s "$directory/source-files.sha256" "$directory/source-files-after-plan.sha256"; then
            echo "Source evidence changed during read-only planning; no restart will be submitted." >&2
            exit 1
          fi
          if [ -n "$prior_checkpoint" ] &&
            [ "$(sha256sum "$prior_checkpoint" | awk '{print $1}')" != "$prior_sha" ]; then
            echo "The prior reservation checkpoint changed during read-only planning." >&2
            exit 1
          fi
          if [ "$(sha256sum "$REPOSITORY_DIRECTORY/$TFVARS_PATH" | awk '{print $1}')" != "$tfvars_sha" ]; then
            echo "The expected topology input changed during read-only planning." >&2
            exit 1
          fi
          python3 -u "$helper" "${args[@]}" --summary-file "$directory/recovery.json" --execute
        displayName: "Plan then submit at most one guarded worker restart"
        retryCountOnTaskFailure: 0
        env:
          RUN_ID: ${{ parameters.target_run_id }}
          CONFIRM_RESUME: ${{ parameters.confirm_resume }}
          SUBSCRIPTION: ${{ parameters.expected_subscription_id }}
          REGION: ${{ parameters.expected_region }}
          TFVARS_PATH: ${{ parameters.tfvars_path }}
          SOURCE_STATE_BUILD_ID: "${{ parameters.source_state_build_id }}"
          SOURCE_DIRECTORY: $(Pipeline.Workspace)/retained-worker-source
          ARTIFACT_DIRECTORY: $(Build.ArtifactStagingDirectory)
          REPOSITORY_DIRECTORY: $(Pipeline.Workspace)/s
          AGENT_TEMP_DIRECTORY: $(Agent.TempDirectory)

      - task: PublishPipelineArtifact@1
        displayName: "Publish the single-worker restart and requalification evidence"
        condition: >-
          and(always(), eq(variables['RETAINED_WORKER_DIAGNOSTICS_READY'], 'true'))
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/n100-retained-worker-restart"
          artifact: "n100-retained-worker-restart-$(Build.BuildId)-$(System.JobAttempt)"
