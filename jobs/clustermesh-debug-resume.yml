parameters:
- name: region
  type: string
  default: eastus2
- name: topology
  type: string
  default: clustermesh-scale-mock
- name: engine
  type: string
  default: clusterloader2
- name: engine_input
  type: object
  default: {}
- name: matrix
  type: object
  default: {}
- name: timeout_in_minutes
  type: number
  default: 3000
- name: cancel_timeout_in_minutes
  type: number
  default: 120
- name: credential_type
  type: string
  default: service_connection
- name: tfvars_path
  type: string
  default: scenarios/perf-eval/clustermesh-scale/terraform-inputs/azure-100-mock-shared.tfvars
- name: expected_subscription_id
  type: string
- name: expected_cluster_count
  type: number
  default: 100
- name: expected_pool_count
  type: number
  default: 201
- name: run_workload
  type: boolean
  default: true
- name: publish_results
  type: boolean
  default: true
- name: manifest_subdir
  type: string
  default: scale-resume
- name: target_run_id
  type: string
- name: overlay_mode
  type: string
  default: resume
  values:
  - resume
  - resume-existing
- name: mock_preservation_mode
  type: string
  default: none
  values:
  - none
  - capture
  - verify
- name: mock_preservation_baseline_build_id
  type: number
  default: 0
- name: mock_preservation_verification_build_id
  type: number
  default: 0

jobs:
- job: azure
  variables:
    CLUSTERMESH_JOB_TIMEOUT_MINUTES: ${{ parameters.timeout_in_minutes }}
    CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: ${{ parameters.cancel_timeout_in_minutes }}
  strategy:
    maxParallel: 1
    matrix:
      ${{ parameters.matrix }}
  timeoutInMinutes: ${{ parameters.timeout_in_minutes }}
  cancelTimeoutInMinutes: ${{ parameters.cancel_timeout_in_minutes }}
  steps:
  - template: /steps/setup-tests.yml
    parameters:
      cloud: azure
      region: ${{ parameters.region }}
      run_id: ${{ parameters.target_run_id }}
      credential_type: ${{ parameters.credential_type }}
      ssh_key_enabled: false

  - ${{ if or(eq(parameters.mock_preservation_mode, 'verify'), and(parameters.run_workload, eq(parameters.mock_preservation_mode, 'none'), eq(parameters.topology, 'clustermesh-scale-mock'))) }}:
    - script: |
        set -euo pipefail
        baseline_dir="$(Pipeline.Workspace)/n100-kwok-baseline"
        rm -rf "$baseline_dir"
        rm -rf "$(Pipeline.Workspace)/n100-kwok-verification-input"
        if [ "$BASELINE_BUILD_ID" -le 0 ]; then
          echo "##vso[task.logissue type=error;] scaleDebugKwokBaselineBuildId must be a positive build ID."
          exit 1
        fi
        if [ "${RUN_WORKLOAD,,}" = "true" ] &&
          [ "$PRESERVATION_MODE" = "none" ] &&
          [ "$VERIFICATION_BUILD_ID" -le 0 ]; then
          echo "##vso[task.logissue type=error;] scaleDebugKwokVerificationBuildId must be a positive build ID for workload mode."
          exit 1
        fi
      displayName: "Prepare preserved n100 KWOK artifact handoff"
      env:
        BASELINE_BUILD_ID: "${{ parameters.mock_preservation_baseline_build_id }}"
        VERIFICATION_BUILD_ID: "${{ parameters.mock_preservation_verification_build_id }}"
        RUN_WORKLOAD: "${{ parameters.run_workload }}"
        PRESERVATION_MODE: ${{ parameters.mock_preservation_mode }}

    - task: DownloadPipelineArtifact@2
      displayName: "Download preserved n100 KWOK baseline"
      inputs:
        buildType: specific
        project: $(System.TeamProjectId)
        definition: $(System.DefinitionId)
        specificBuildWithTriggering: false
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.mock_preservation_baseline_build_id }}
        artifactName: n100-kwok-preservation-${{ parameters.mock_preservation_baseline_build_id }}
        targetPath: $(Pipeline.Workspace)/n100-kwok-baseline

  - ${{ if and(parameters.run_workload, eq(parameters.mock_preservation_mode, 'none'), eq(parameters.topology, 'clustermesh-scale-mock')) }}:
    - task: DownloadPipelineArtifact@2
      displayName: "Download preserved n100 KWOK verification proof"
      inputs:
        buildType: specific
        project: $(System.TeamProjectId)
        definition: $(System.DefinitionId)
        specificBuildWithTriggering: false
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.mock_preservation_verification_build_id }}
        artifactName: n100-kwok-verification-${{ parameters.mock_preservation_verification_build_id }}
        targetPath: $(Pipeline.Workspace)/n100-kwok-verification-input

  - ${{ if eq(parameters.mock_preservation_mode, 'verify') }}:
    - script: |
        set -euo pipefail
        artifact_dir="$(Build.ArtifactStagingDirectory)/n100-kwok-verification"
        mkdir -p "$artifact_dir"
        python3 - "$artifact_dir/summary.json" "$RUN_ID" "$BASELINE_BUILD_ID" <<'PY'
        import json
        import sys
        from datetime import datetime, timezone

        path, run_id, baseline_build_id = sys.argv[1:]
        with open(path, "w", encoding="utf-8") as handle:
            json.dump(
                {
                    "schema_version": 1,
                    "started_at": datetime.now(timezone.utc).strftime(
                        "%Y-%m-%dT%H:%M:%SZ"
                    ),
                    "finished_at": None,
                    "healthy": False,
                    "identity_verification_healthy": False,
                    "cross_cluster_data_path_valid": False,
                    "no_cl2_scenarios_run": True,
                    "stage": "pipeline_preflight",
                    "run_id": run_id,
                    "baseline_build_id": int(baseline_build_id),
                },
                handle,
                indent=2,
                sort_keys=True,
            )
            handle.write("\n")
        PY
      displayName: "Prepare preserved n100 KWOK verification evidence"
      env:
        RUN_ID: ${{ parameters.target_run_id }}
        BASELINE_BUILD_ID: "${{ parameters.mock_preservation_baseline_build_id }}"

  - script: |
      set -euo pipefail
      if [ "${CLUSTERMESH_PRESERVED_AKS_ARM_RECONCILE_ENABLED:-false}" != "true" ]; then
        echo "Preserved AKS ARM state reconciliation disabled; skipping."
        exit 0
      fi
      if [ "$CLUSTERMESH_DEBUG_CONFIRM_RESUME" != "$RUN_ID" ]; then
        echo "CLUSTERMESH_DEBUG_CONFIRM_RESUME must equal $RUN_ID." >&2
        exit 1
      fi
      summary_dir="$(Build.ArtifactStagingDirectory)/${{ parameters.manifest_subdir }}"
      mkdir -p "$summary_dir"
      expected_tfvars_sha=$(sha256sum \
        "$(Pipeline.Workspace)/s/${{ parameters.tfvars_path }}" \
        | awk '{print $1}')
      python3 "$PRESERVED_AKS_ARM_RECONCILER" \
        --resource-group "$RUN_ID" \
        --expected-subscription "${{ parameters.expected_subscription_id }}" \
        --expected-region "${{ parameters.region }}" \
        --expected-count "${{ parameters.expected_cluster_count }}" \
        --expected-tfvars-sha "$expected_tfvars_sha" \
        --max-repair-clusters "${CLUSTERMESH_DEBUG_MAX_AKS_ARM_REPAIR_CLUSTERS:-10}" \
        --max-concurrent "${CLUSTERMESH_DEBUG_AKS_ARM_REPAIR_CONCURRENCY:-2}" \
        --summary-file "$summary_dir/aks-arm-reconcile.json"
      echo "##vso[task.uploadfile]$summary_dir/aks-arm-reconcile.json"
    displayName: "Reconcile stale preserved AKS ARM states"
    env:
      PRESERVED_AKS_ARM_RECONCILER: $(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/preserved_aks_arm_reconcile.py
      RUN_ID: ${{ parameters.target_run_id }}
      CLUSTERMESH_DEBUG_CONFIRM_RESUME: $(CLUSTERMESH_DEBUG_CONFIRM_RESUME)

  - script: |
      set -euo pipefail
      if [ "$CLUSTERMESH_DEBUG_CONFIRM_RESUME" != "$RUN_ID" ]; then
        echo "CLUSTERMESH_DEBUG_CONFIRM_RESUME must equal $RUN_ID." >&2
        exit 1
      fi
      export CLUSTERMESH_DEBUG_EXPECTED_TFVARS_SHA256
      CLUSTERMESH_DEBUG_EXPECTED_TFVARS_SHA256=$(sha256sum \
        "$(Pipeline.Workspace)/s/${{ parameters.tfvars_path }}" \
        | awk '{print $1}')
      bash "$(Pipeline.Workspace)/s/steps/topology/clustermesh-scale/reuse/validate-existing-scale.sh"
      if [ "$OVERLAY_MODE" = "resume" ]; then
        bash "$(Pipeline.Workspace)/s/steps/topology/clustermesh-scale/reuse/create-staged-fleet-overlay.sh"
      else
        bash "$(Pipeline.Workspace)/s/steps/topology/clustermesh-scale/reuse/repair-existing-fleet-overlay.sh"
      fi
    displayName: "Validate preserved scale clusters and prepare Fleet overlay"
    env:
      OVERLAY_MODE: ${{ parameters.overlay_mode }}
      RUN_ID: ${{ parameters.target_run_id }}
      CLUSTERMESH_DEBUG_TARGET_RUN_ID: $(RUN_ID)
      CLUSTERMESH_DEBUG_CONFIRM_RESUME: $(CLUSTERMESH_DEBUG_CONFIRM_RESUME)
      CLUSTERMESH_DEBUG_EXPECTED_SUBSCRIPTION_ID: ${{ parameters.expected_subscription_id }}
      CLUSTERMESH_DEBUG_EXPECTED_REGION: ${{ parameters.region }}
      CLUSTERMESH_DEBUG_EXPECTED_CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      CLUSTERMESH_DEBUG_EXTEND_LEASE_HOURS: "168"
      CLUSTERMESH_DEBUG_REQUIRE_OVERLAY_RESET: ${{ eq(parameters.overlay_mode, 'resume') }}
      CLUSTERMESH_DEBUG_MAX_REPAIR_MEMBERS: "20"
      CLUSTERMESH_DEBUG_MANIFEST_PATH: $(Build.ArtifactStagingDirectory)/${{ parameters.manifest_subdir }}/validation.json

  - template: /steps/validate-resources.yml
    parameters:
      cloud: azure
      regions:
      - ${{ parameters.region }}
      topology: ${{ parameters.topology }}
      engine: ${{ parameters.engine }}

  - ${{ if eq(parameters.mock_preservation_mode, 'capture') }}:
    - template: /steps/topology/clustermesh-scale-mock/deploy-mock-layer.yml
      parameters:
        cloud: azure
        engine: ${{ parameters.engine }}
        regions:
        - ${{ parameters.region }}
    - script: |
        set -euo pipefail
        artifact_dir="$(Build.ArtifactStagingDirectory)/n100-kwok-preservation"
        mkdir -p "$artifact_dir"
        python3 "$PRESERVED_MOCK_CAPTURE" \
          --clusters "$HOME/.kube/clustermesh-clusters.json" \
          --state-root "$HOME/.kube/mock-layer-state/$RUN_ID" \
          --artifact-dir "$artifact_dir" \
          --run-id "$RUN_ID" \
          --expected-cluster-count "${{ parameters.expected_cluster_count }}" \
          --expected-mock-count "${MOCK_NODE_COUNT:-100}" \
          --max-concurrent "${MOCK_CAPTURE_CONCURRENCY:-8}"
      displayName: "Capture preserved n100 KWOK baseline"
      env:
        PRESERVED_MOCK_CAPTURE: $(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/preserved_mock_capture.py
        RUN_ID: ${{ parameters.target_run_id }}
    - task: PublishPipelineArtifact@1
      displayName: "Publish preserved n100 KWOK baseline"
      condition: always()
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/n100-kwok-preservation
        artifact: n100-kwok-preservation-$(Build.BuildId)

  - ${{ if eq(parameters.mock_preservation_mode, 'verify') }}:
    - script: |
        set -euo pipefail
        artifact_dir="$(Build.ArtifactStagingDirectory)/n100-kwok-verification"
        python3 "$PRESERVED_MOCK_VERIFY" \
          --baseline-dir "$(Pipeline.Workspace)/n100-kwok-baseline" \
          --baseline-build-id "${{ parameters.mock_preservation_baseline_build_id }}" \
          --clusters "$HOME/.kube/clustermesh-clusters.json" \
          --state-root "$HOME/.kube/mock-layer-state/$RUN_ID" \
          --artifact-dir "$artifact_dir" \
          --reconciler "$MOCK_LAYER_RECONCILER" \
          --run-id "$RUN_ID" \
          --expected-subscription-id "${{ parameters.expected_subscription_id }}" \
          --expected-cluster-count "${{ parameters.expected_cluster_count }}" \
          --expected-mock-count "${MOCK_NODE_COUNT:-100}" \
          --expected-pool-count "${{ parameters.expected_pool_count }}" \
          --fault-role mesh-1 \
          --fault-role mesh-25 \
          --fault-role mesh-50 \
          --fault-role mesh-75 \
          --fault-role mesh-100 \
          --fault-count 5 \
          --fault-agent-start 0 \
          --fault-node-start 10 \
          --max-concurrent "${MOCK_VERIFY_CONCURRENCY:-8}" \
          --reconcile-concurrent "${MOCK_RECONCILE_CONCURRENCY:-8}"
      displayName: "Verify preserved n100 KWOK identities and exact recovery"
      env:
        PRESERVED_MOCK_VERIFY: $(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/preserved_mock_verify.py
        MOCK_LAYER_RECONCILER: $(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/mock_layer_reconcile.py
        RUN_ID: ${{ parameters.target_run_id }}

    - script: |
        set -euo pipefail
        summary="$(Build.ArtifactStagingDirectory)/n100-kwok-verification/summary.json"
        set +e
        bash "$(Pipeline.Workspace)/s/steps/topology/clustermesh-scale/cross-cluster-smoke.sh"
        smoke_rc=$?
        set -e
        python3 - "$summary" "$smoke_rc" <<'PY'
        import json
        import os
        import sys
        from datetime import datetime, timezone

        path = sys.argv[1]
        smoke_rc = int(sys.argv[2])
        with open(path, encoding="utf-8") as handle:
            payload = json.load(handle)
        if payload.get("identity_verification_healthy") is not True:
            raise SystemExit("identity verification did not complete successfully")
        payload.update(
            {
                "finished_at": datetime.now(timezone.utc).strftime(
                    "%Y-%m-%dT%H:%M:%SZ"
                ),
                "healthy": smoke_rc == 0,
                "cross_cluster_data_path_valid": smoke_rc == 0,
                "stage": (
                    "complete"
                    if smoke_rc == 0
                    else "cross_cluster_data_path_failed"
                ),
            }
        )
        if smoke_rc != 0:
            payload["fatal_error"] = (
                f"cross-cluster data-path smoke exited with code {smoke_rc}"
            )
        temporary = f"{path}.tmp"
        with open(temporary, "w", encoding="utf-8") as handle:
            json.dump(payload, handle, indent=2, sort_keys=True)
            handle.write("\n")
        os.replace(temporary, path)
        PY
        if [ "$smoke_rc" -ne 0 ]; then
          exit "$smoke_rc"
        fi
      displayName: "Revalidate cross-cluster data path after KWOK recovery"
      env:
        CLUSTERMESH_CROSS_CLUSTER_SMOKE_ENABLED: "true"

    - script: |
        set -euo pipefail
        artifact_dir="$(Build.ArtifactStagingDirectory)/n100-kwok-verification"
        summary="$artifact_dir/summary.json"
        mkdir -p "$artifact_dir"
        python3 - "$summary" "$RUN_ID" "$BASELINE_BUILD_ID" <<'PY'
        import json
        import os
        import sys
        from datetime import datetime, timezone

        path, run_id, baseline_build_id = sys.argv[1:]
        now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        if os.path.isfile(path):
            with open(path, encoding="utf-8") as handle:
                payload = json.load(handle)
        else:
            payload = {
                "schema_version": 1,
                "started_at": None,
                "healthy": False,
                "identity_verification_healthy": False,
                "cross_cluster_data_path_valid": False,
                "no_cl2_scenarios_run": True,
                "run_id": run_id,
                "baseline_build_id": int(baseline_build_id),
            }
        if payload.get("finished_at") is None:
            payload.update(
                {
                    "finished_at": now,
                    "healthy": False,
                    "stage": "pipeline_failed_before_verification_completion",
                    "fatal_error": payload.get("fatal_error")
                    or (
                        "pipeline failed before verification summary completed; "
                        "inspect preceding task logs"
                    ),
                }
            )
        temporary = f"{path}.tmp"
        with open(temporary, "w", encoding="utf-8") as handle:
            json.dump(payload, handle, indent=2, sort_keys=True)
            handle.write("\n")
        os.replace(temporary, path)
        PY
      displayName: "Finalize incomplete preserved n100 KWOK verification evidence"
      condition: always()
      env:
        RUN_ID: ${{ parameters.target_run_id }}
        BASELINE_BUILD_ID: "${{ parameters.mock_preservation_baseline_build_id }}"

    - task: PublishPipelineArtifact@1
      displayName: "Publish preserved n100 KWOK verification"
      condition: always()
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/n100-kwok-verification
        artifact: n100-kwok-verification-$(Build.BuildId)

  - ${{ if and(parameters.run_workload, eq(parameters.mock_preservation_mode, 'none')) }}:
    - template: /steps/execute-tests.yml
      parameters:
        cloud: azure
        topology: ${{ parameters.topology }}
        engine: ${{ parameters.engine }}
        regions:
        - ${{ parameters.region }}
        engine_input: ${{ parameters.engine_input }}
        mock_handoff_enabled: ${{ eq(parameters.topology, 'clustermesh-scale-mock') }}
        mock_handoff_run_id: ${{ parameters.target_run_id }}
        mock_handoff_baseline_build_id: ${{ parameters.mock_preservation_baseline_build_id }}
        mock_handoff_verification_build_id: ${{ parameters.mock_preservation_verification_build_id }}
        mock_handoff_expected_subscription_id: ${{ parameters.expected_subscription_id }}
        mock_handoff_expected_cluster_count: ${{ parameters.expected_cluster_count }}
        mock_handoff_expected_mock_count: 100
        mock_handoff_expected_pool_count: ${{ parameters.expected_pool_count }}

  - ${{ if and(parameters.run_workload, parameters.publish_results, eq(parameters.mock_preservation_mode, 'none')) }}:
    - template: /steps/publish-results.yml
      parameters:
        cloud: azure
        topology: ${{ parameters.topology }}
        engine: ${{ parameters.engine }}
        regions:
        - ${{ parameters.region }}
        engine_input: ${{ parameters.engine_input }}
        credential_type: ${{ parameters.credential_type }}

  - template: /steps/topology/clustermesh-scale/reuse/write-resume-manifest.yml
    parameters:
      enabled: true
      region: ${{ parameters.region }}
      tfvars_path: ${{ parameters.tfvars_path }}
