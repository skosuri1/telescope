parameters:
  - name: target_run_id
    type: string
  - name: confirm_resume
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: overlay_mode
    type: string
  - name: run_workload
    type: boolean
  - name: source_build_id
    type: number
  - name: exclusive_modes
    type: boolean

jobs:
  - job: readiness_diagnostics
    displayName: "Read-only diagnosis of failed workload readiness"
    timeoutInMinutes: 35
    cancelTimeoutInMinutes: 5
    variables:
      SCENARIO_NAME: clustermesh-scale
      CLUSTER_COUNT: "100"
      SUITE_TOTAL_BUDGET_SECONDS: "0"
      CLUSTERMESH_JOB_TIMEOUT_MINUTES: "35"
      CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: "5"
      AKS_CONTROL_PLANE_METRICS_ENABLED: "false"
    steps:
      - script: |
          set -euo pipefail
          jq -e '
            .target_run_id == "78751-f36f3d5a" and .confirm_resume == .target_run_id
            and .expected_subscription_id == "37deca37-c375-4a14-b90a-043849bd2bf1"
            and .expected_region == "eastus2euap" and .expected_cluster_count == 100
            and .tfvars_path == "scenarios/perf-eval/clustermesh-scale/terraform-inputs/azure-100-mock-shared.tfvars"
            and .overlay_mode == "resume-existing" and .run_workload == false
            and .source_build_id == 80017 and .exclusive_modes == true' <<< "$SCOPE_JSON" >/dev/null
        displayName: "Require exact read-only failed-workload diagnostic scope"
        env:
          SCOPE_JSON: ${{ convertToJson(parameters) }}
      - template: /steps/setup-tests.yml
        parameters:
          cloud: azure
          region: ${{ parameters.expected_region }}
          run_id: ${{ parameters.target_run_id }}
          credential_type: service_connection
          ssh_key_enabled: false
      - task: DownloadPipelineArtifact@2
        displayName: "Download exact failed workload preflight"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.source_build_id }}
          artifactName: n100-aks-arm-reconcile-${{ parameters.source_build_id }}-1
          itemPattern: aks-arm-reconcile.json
          targetPath: $(Pipeline.Workspace)/readiness-diagnostic-source
      - script: |
          set -euo pipefail
          umask 077
          expected_sha=$(sha256sum "$REPOSITORY_DIRECTORY/$TFVARS_PATH" | awk '{print $1}')
          python3 -u "$REPOSITORY_DIRECTORY/modules/python/clusterloader2/clustermesh-scale/preserved_readiness_diagnostics.py" \
            --source "$SOURCE_DIRECTORY/aks-arm-reconcile.json" --source-build-id 80017 \
            --expected-tfvars-sha "$expected_sha" \
            --output-directory "$ARTIFACT_DIRECTORY/n100-readiness-diagnostics"
        displayName: "Read affected Nodes, Cilium status, VM health, and failed pool operations"
        timeoutInMinutes: 25
        retryCountOnTaskFailure: 0
        env:
          REPOSITORY_DIRECTORY: $(Pipeline.Workspace)/s
          TFVARS_PATH: ${{ parameters.tfvars_path }}
          SOURCE_DIRECTORY: $(Pipeline.Workspace)/readiness-diagnostic-source
          ARTIFACT_DIRECTORY: $(Build.ArtifactStagingDirectory)
      - task: PublishPipelineArtifact@1
        displayName: "Publish read-only readiness diagnosis"
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/n100-readiness-diagnostics
          artifact: n100-readiness-diagnostics-$(Build.BuildId)-$(System.JobAttempt)
