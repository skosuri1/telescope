parameters:
  - name: target_run_id
    type: string
  - name: confirm_resume
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: overlay_mode
    type: string
  - name: run_workload
    type: boolean
  - name: original_plan_build_id
    type: number
  - name: modern_prom_build_id
    type: number
  - name: exclusive_modes
    type: boolean

jobs:
  - job: modern_cni_recovery
    displayName: "Recover one CNI worker with supported-family capacity"
    variables:
      SCENARIO_NAME: clustermesh-scale
      CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      CLUSTERMESH_JOB_TIMEOUT_MINUTES: "120"
      CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: "30"
      SUITE_TOTAL_BUDGET_SECONDS: "0"
      AKS_CONTROL_PLANE_METRICS_ENABLED: "false"
    timeoutInMinutes: 120
    cancelTimeoutInMinutes: 30
    steps:
      - script: |
          set -euo pipefail
          jq -e '
            .target_run_id == "78751-f36f3d5a" and .confirm_resume == .target_run_id
            and .expected_subscription_id == "37deca37-c375-4a14-b90a-043849bd2bf1"
            and .expected_region == "eastus2euap" and .expected_cluster_count == 100
            and .overlay_mode == "resume-existing" and .run_workload == false
            and .original_plan_build_id == 79880
            and (.modern_prom_build_id | type == "number" and . > 0 and floor == .)
            and .exclusive_modes == true' <<< "$RECOVERY_SCOPE_JSON" >/dev/null
        displayName: "Require exact modern CNI source and completed monitoring checkpoint"
        env:
          RECOVERY_SCOPE_JSON: ${{ convertToJson(parameters) }}

      - template: /steps/setup-tests.yml
        parameters:
          cloud: azure
          region: ${{ parameters.expected_region }}
          run_id: ${{ parameters.target_run_id }}
          credential_type: service_connection
          ssh_key_enabled: false

      - task: DownloadPipelineArtifact@2
        displayName: "Download original mesh96 identity inventory"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.original_plan_build_id }}
          artifactName: n100-unreachable-worker-recovery-${{ parameters.original_plan_build_id }}-1
          targetPath: $(Pipeline.Workspace)/modern-cni-original

      - task: DownloadPipelineArtifact@2
        displayName: "Download completed supported-family monitoring recovery"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.modern_prom_build_id }}
          artifactName: n100-unreachable-worker-recovery-${{ parameters.modern_prom_build_id }}-1
          targetPath: $(Pipeline.Workspace)/modern-cni-monitoring

      - script: |
          set -euo pipefail
          umask 077
          directory="$(Build.ArtifactStagingDirectory)/n100-modern-cni"
          mkdir -p "$directory"
          echo "##vso[task.setvariable variable=MODERN_CNI_DIAGNOSTICS_READY]true"
          cp "$(Pipeline.Workspace)/modern-cni-original/input-plan.json" "$directory/input-plan.json"
          cp "$(Pipeline.Workspace)/modern-cni-monitoring/recovery.json" "$directory/modern-prom-source.json"
          plan_sha=$(sha256sum "$directory/input-plan.json" | awk '{print $1}')
          prom_sha=$(sha256sum "$directory/modern-prom-source.json" | awk '{print $1}')
          tfvars_sha=$(sha256sum "$(Pipeline.Workspace)/s/$TFVARS_PATH" | awk '{print $1}')
          private=$(mktemp -d "$(Agent.TempDirectory)/modern-cni.XXXXXX")
          cleanup() {
            rm -f -- "$private/cluster.config"
            rmdir -- "$private"
          }
          trap cleanup EXIT
          az aks get-credentials --subscription "$SUBSCRIPTION" --resource-group "$RUN_ID" \
            --name clustermesh-96 --file "$private/cluster.config" --context clustermesh-96 --only-show-errors
          chmod 600 "$private/cluster.config"
          helper="$(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/modern_cni_recovery.py"
          args=(
            --resource-group "$RUN_ID" --confirm-resource-group "$CONFIRM_RESUME"
            --expected-subscription "$SUBSCRIPTION" --expected-region "$REGION"
            --expected-tfvars-sha "$tfvars_sha" --plan-file "$directory/input-plan.json"
            --modern-prom-checkpoint "$directory/modern-prom-source.json"
            --kubeconfig "$private/cluster.config" --context clustermesh-96 --timeout-seconds 5400
          )
          python3 -u "$helper" "${args[@]}" --summary-file "$directory/plan.json"
          jq -e '.execute == false and .mutation_started == false
            and (.plan_valid == true or .success == true)' "$directory/plan.json" >/dev/null
          if [ "$(sha256sum "$directory/input-plan.json" | awk '{print $1}')" != "$plan_sha" ] ||
            [ "$(sha256sum "$directory/modern-prom-source.json" | awk '{print $1}')" != "$prom_sha" ]; then
            echo "Modern CNI source identities changed during read-only planning." >&2
            exit 1
          fi
          python3 -u "$helper" "${args[@]}" --summary-file "$directory/recovery.json" --execute
        displayName: "Plan then recover exact CNI source without legacy allocation"
        retryCountOnTaskFailure: 0
        env:
          RUN_ID: ${{ parameters.target_run_id }}
          CONFIRM_RESUME: ${{ parameters.confirm_resume }}
          SUBSCRIPTION: ${{ parameters.expected_subscription_id }}
          REGION: ${{ parameters.expected_region }}
          TFVARS_PATH: ${{ parameters.tfvars_path }}

      - task: PublishPipelineArtifact@1
        displayName: "Publish supported-family CNI and baseline-delta evidence"
        condition: >-
          and(always(), eq(variables['MODERN_CNI_DIAGNOSTICS_READY'], 'true'))
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/n100-modern-cni"
          artifact: "n100-modern-cni-$(Build.BuildId)-$(System.JobAttempt)"
