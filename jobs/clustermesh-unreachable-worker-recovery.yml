parameters:
  - name: target_run_id
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: overlay_mode
    type: string
  - name: run_workload
    type: boolean
  - name: plan_json
    type: string
  - name: reimage_failed_os
    type: boolean
    default: false
  - name: observe_build_id
    type: number
    default: 0
  - name: replace_failed_host_build_id
    type: number
    default: 0
  - name: resume_replacement_build_id
    type: number
    default: 0
  - name: quota_observe_only
    type: boolean
    default: false

jobs:
  - job: unreachable_worker_recovery
    displayName: "Recover one explicitly selected unreachable n100 worker"
    variables:
      SCENARIO_NAME: clustermesh-scale
      CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      CLUSTERMESH_JOB_TIMEOUT_MINUTES: "90"
      CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: "30"
      SUITE_TOTAL_BUDGET_SECONDS: "0"
      AKS_CONTROL_PLANE_METRICS_ENABLED: "false"
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 30
    steps:
      - script: |
          set -euo pipefail
          if [ "$EXPECTED_CLUSTER_COUNT" != "100" ] ||
            [ "$OVERLAY_MODE" != "resume-existing" ] ||
            [ "${RUN_WORKLOAD,,}" != "false" ] ||
            [ "${RECOVERY_ONLY,,}" != "true" ] ||
            [ "${ARM_REPAIR_ONLY,,}" = "true" ] ||
            [ "${RETIREMENT_ONLY,,}" = "true" ] ||
            [ "${OBSERVE_ONLY,,}" = "true" ] ||
            [ "${CNI_MAINTENANCE_ONLY,,}" = "true" ]; then
            echo "Unreachable-worker recovery requires existing n100 and no workload or other maintenance mode." >&2
            exit 1
          fi
          if ! [[ "$OBSERVE_BUILD_ID" =~ ^(0|[1-9][0-9]*)$ ]] ||
            { [ "$OBSERVE_BUILD_ID" != "0" ] && [ "${REIMAGE_FAILED_OS,,}" != "true" ]; }; then
            echo "Accepted-action observation requires a positive source build ID and the OS-reimage mode." >&2
            exit 1
          fi
          if ! [[ "$REPLACE_FAILED_HOST_BUILD_ID" =~ ^(0|[1-9][0-9]*)$ ]] ||
            { [ "$REPLACE_FAILED_HOST_BUILD_ID" != "0" ] &&
              { [ "$OBSERVE_BUILD_ID" != "0" ] || [ "${REIMAGE_FAILED_OS,,}" != "false" ]; }; }; then
            echo "Failed-host replacement requires its accepted-action build and excludes observation or reimage." >&2
            exit 1
          fi
          if ! [[ "$RESUME_REPLACEMENT_BUILD_ID" =~ ^(0|[1-9][0-9]*)$ ]] ||
            { [ "$RESUME_REPLACEMENT_BUILD_ID" != "0" ] &&
              [ "$REPLACE_FAILED_HOST_BUILD_ID" = "0" ]; } ||
            { [ "${QUOTA_OBSERVE_ONLY,,}" = "true" ] && [ "$RESUME_REPLACEMENT_BUILD_ID" = "0" ]; }; then
            echo "Native-action continuation or observation requires its checkpoint and original accepted lineage." >&2
            exit 1
          fi
          if { [ -z "$RECOVERY_PLAN_JSON" ] && [ "$REPLACE_FAILED_HOST_BUILD_ID" = "0" ]; } ||
            [ "${#RECOVERY_PLAN_JSON}" -gt 32768 ]; then
            echo "An explicit bounded identity plan or the failed-host source artifact is required." >&2
            exit 1
          fi
          if [ -n "$RECOVERY_PLAN_JSON" ]; then
            jq -e \
              'type == "object" and .schema_version == 1
               and (.role | type == "string")
               and (.node_name | type == "string")
               and (.node_uid | type == "string")' \
              <<< "$RECOVERY_PLAN_JSON" >/dev/null
          fi
        displayName: "Require one exclusive unreachable-worker recovery plan"
        env:
          EXPECTED_CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
          OVERLAY_MODE: ${{ parameters.overlay_mode }}
          RUN_WORKLOAD: "${{ parameters.run_workload }}"
          RECOVERY_ONLY: $(CLUSTERMESH_UNREACHABLE_WORKER_RECOVERY_ONLY)
          ARM_REPAIR_ONLY: $(CLUSTERMESH_ARM_REPAIR_ONLY)
          RETIREMENT_ONLY: $(CLUSTERMESH_PREPARED_RETIREMENT_ONLY)
          OBSERVE_ONLY: $(CLUSTERMESH_PREPARED_RETIREMENT_OBSERVE_ONLY)
          CNI_MAINTENANCE_ONLY: $(CLUSTERMESH_CNI_WORKER_MAINTENANCE_ONLY)
          RECOVERY_PLAN_JSON: ${{ parameters.plan_json }}
          OBSERVE_BUILD_ID: "${{ parameters.observe_build_id }}"
          REPLACE_FAILED_HOST_BUILD_ID: "${{ parameters.replace_failed_host_build_id }}"
          RESUME_REPLACEMENT_BUILD_ID: "${{ parameters.resume_replacement_build_id }}"
          QUOTA_OBSERVE_ONLY: "${{ parameters.quota_observe_only }}"
          REIMAGE_FAILED_OS: "${{ parameters.reimage_failed_os }}"

      - template: /steps/setup-tests.yml
        parameters:
          cloud: azure
          region: ${{ parameters.expected_region }}
          run_id: ${{ parameters.target_run_id }}
          credential_type: service_connection
          ssh_key_enabled: false

      - ${{ if gt(parameters.observe_build_id, 0) }}:
          - task: DownloadPipelineArtifact@2
            displayName: "Download the accepted host-action receipt"
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              definition: $(System.DefinitionId)
              specificBuildWithTriggering: false
              buildVersionToDownload: specific
              pipelineId: ${{ parameters.observe_build_id }}
              artifactName: n100-unreachable-worker-recovery-${{ parameters.observe_build_id }}-1
              targetPath: $(Pipeline.Workspace)/accepted-host-action-${{ parameters.observe_build_id }}

      - ${{ if gt(parameters.replace_failed_host_build_id, 0) }}:
          - task: DownloadPipelineArtifact@2
            displayName: "Download the failed host's accepted-action lineage"
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              definition: $(System.DefinitionId)
              specificBuildWithTriggering: false
              buildVersionToDownload: specific
              pipelineId: ${{ parameters.replace_failed_host_build_id }}
              artifactName: n100-unreachable-worker-recovery-${{ parameters.replace_failed_host_build_id }}-1
              targetPath: $(Pipeline.Workspace)/accepted-failed-host-${{ parameters.replace_failed_host_build_id }}

      - ${{ if gt(parameters.resume_replacement_build_id, 0) }}:
          - task: DownloadPipelineArtifact@2
            displayName: "Download the native replacement outcome"
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              definition: $(System.DefinitionId)
              specificBuildWithTriggering: false
              buildVersionToDownload: specific
              pipelineId: ${{ parameters.resume_replacement_build_id }}
              artifactName: n100-unreachable-worker-recovery-${{ parameters.resume_replacement_build_id }}-1
              targetPath: $(Pipeline.Workspace)/native-host-action-${{ parameters.resume_replacement_build_id }}

      - ${{ if parameters.quota_observe_only }}:
          - template: /steps/topology/clustermesh-scale/reuse/observe-native-prom-quota.yml
            parameters:
              target_run_id: ${{ parameters.target_run_id }}
              expected_subscription_id: ${{ parameters.expected_subscription_id }}
              expected_region: ${{ parameters.expected_region }}
              expected_cluster_count: ${{ parameters.expected_cluster_count }}
              native_build_id: ${{ parameters.resume_replacement_build_id }}

      - ${{ if not(parameters.quota_observe_only) }}:
          - template: /steps/topology/clustermesh-scale/reuse/recover-unreachable-worker.yml
            parameters:
              target_run_id: ${{ parameters.target_run_id }}
              expected_subscription_id: ${{ parameters.expected_subscription_id }}
              expected_region: ${{ parameters.expected_region }}
              expected_cluster_count: ${{ parameters.expected_cluster_count }}
              tfvars_path: ${{ parameters.tfvars_path }}
              plan_json: ${{ parameters.plan_json }}
              reimage_failed_os: ${{ parameters.reimage_failed_os }}
              observe_build_id: ${{ parameters.observe_build_id }}
              replace_failed_host_build_id: ${{ parameters.replace_failed_host_build_id }}
              resume_replacement_build_id: ${{ parameters.resume_replacement_build_id }}
