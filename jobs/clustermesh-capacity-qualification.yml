parameters:
  - name: target_run_id
    type: string
  - name: confirm_resume
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: overlay_mode
    type: string
  - name: run_workload
    type: boolean
  - name: observation_build_id
    type: number
  - name: accepted_capacity_build_id
    type: number
  - name: exclusive_modes
    type: boolean

jobs:
  - job: capacity_qualification
    displayName: "Qualify existing mesh96 replacements without moving workloads"
    variables:
      SCENARIO_NAME: clustermesh-scale
      CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      CLUSTERMESH_JOB_TIMEOUT_MINUTES: "75"
      CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: "30"
      SUITE_TOTAL_BUDGET_SECONDS: "0"
      AKS_CONTROL_PLANE_METRICS_ENABLED: "false"
    timeoutInMinutes: 75
    cancelTimeoutInMinutes: 30
    steps:
      - script: |
          set -euo pipefail
          jq -e '
            .target_run_id == "78751-f36f3d5a" and .confirm_resume == .target_run_id
            and .expected_subscription_id == "37deca37-c375-4a14-b90a-043849bd2bf1"
            and .expected_region == "eastus2euap" and .expected_cluster_count == 100
            and .tfvars_path == "scenarios/perf-eval/clustermesh-scale/terraform-inputs/azure-100-mock-shared.tfvars"
            and .overlay_mode == "resume-existing" and .run_workload == false
            and (.observation_build_id == 79975 or .observation_build_id == 79979)
            and .accepted_capacity_build_id == 79971
            and .exclusive_modes == true' <<< "$QUALIFICATION_SCOPE_JSON" >/dev/null
        displayName: "Require exclusive existing-capacity qualification"
        env:
          QUALIFICATION_SCOPE_JSON: ${{ convertToJson(parameters) }}

      - template: /steps/setup-tests.yml
        parameters:
          cloud: azure
          region: ${{ parameters.expected_region }}
          run_id: ${{ parameters.target_run_id }}
          credential_type: service_connection
          ssh_key_enabled: false

      - task: DownloadPipelineArtifact@2
        displayName: "Download current replacement registration evidence"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.observation_build_id }}
          ${{ if eq(parameters.observation_build_id, 79979) }}:
            artifactName: n100-capacity-qualification-79979-1
          ${{ else }}:
            artifactName: n100-unreachable-worker-recovery-${{ parameters.observation_build_id }}-1
          targetPath: $(Pipeline.Workspace)/capacity-qualification-observation

      - task: DownloadPipelineArtifact@2
        displayName: "Download the sole accepted capacity creation"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.accepted_capacity_build_id }}
          artifactName: n100-capacity-first-${{ parameters.accepted_capacity_build_id }}-1
          targetPath: $(Pipeline.Workspace)/capacity-qualification-creation

      - template: /steps/topology/clustermesh-scale/reuse/qualify-existing-capacity.yml
        parameters:
          phase: plan
          scope: ${{ parameters }}

      - task: PublishPipelineArtifact@1
        displayName: "Publish qualification plan before any probes"
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/n100-capacity-qualification/plan.json"
          artifact: "n100-capacity-qualification-plan-$(Build.BuildId)-$(System.JobAttempt)"

      - template: /steps/topology/clustermesh-scale/reuse/qualify-existing-capacity.yml
        parameters:
          phase: execute
          scope: ${{ parameters }}

      - task: PublishPipelineArtifact@1
        displayName: "Publish capacity qualification and owned-probe cleanup evidence"
        condition: >-
          and(always(), eq(variables['CAPACITY_QUALIFICATION_DIAGNOSTICS_READY'], 'true'))
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/n100-capacity-qualification"
          artifact: "n100-capacity-qualification-$(Build.BuildId)-$(System.JobAttempt)"
