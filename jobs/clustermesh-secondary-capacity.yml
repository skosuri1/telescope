parameters:
  - name: target_run_id
    type: string
  - name: confirm_resume
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: overlay_mode
    type: string
  - name: run_workload
    type: boolean
  - name: source_build_id
    type: number
  - name: exclusive_modes
    type: boolean

jobs:
  - job: secondary_capacity_recovery
    displayName: "Observe accepted mesh51 capacity and add the three unsubmitted pools"
    timeoutInMinutes: 160
    cancelTimeoutInMinutes: 30
    variables:
      SCENARIO_NAME: clustermesh-scale
      CLUSTER_COUNT: "100"
      SUITE_TOTAL_BUDGET_SECONDS: "0"
      CLUSTERMESH_JOB_TIMEOUT_MINUTES: "160"
      CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: "30"
      AKS_CONTROL_PLANE_METRICS_ENABLED: "false"
    steps:
      - script: |
          set -euo pipefail
          jq -e '
            .target_run_id == "78751-f36f3d5a" and .confirm_resume == .target_run_id
            and .expected_subscription_id == "37deca37-c375-4a14-b90a-043849bd2bf1"
            and .expected_region == "eastus2euap" and .expected_cluster_count == 100
            and .tfvars_path == "scenarios/perf-eval/clustermesh-scale/terraform-inputs/azure-100-mock-shared.tfvars"
            and .overlay_mode == "resume-existing" and .run_workload == false
            and .source_build_id == 80022 and .exclusive_modes == true' <<< "$SCOPE_JSON" >/dev/null
        displayName: "Require exact capacity-only source and scope"
        env:
          SCOPE_JSON: ${{ convertToJson(parameters) }}
      - template: /steps/setup-tests.yml
        parameters:
          cloud: azure
          region: ${{ parameters.expected_region }}
          run_id: ${{ parameters.target_run_id }}
          credential_type: service_connection
          ssh_key_enabled: false
      - task: DownloadPipelineArtifact@2
        displayName: "Download the actual six-role readiness diagnosis"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.source_build_id }}
          artifactName: n100-readiness-diagnostics-${{ parameters.source_build_id }}-1
          targetPath: $(Pipeline.Workspace)/secondary-capacity-source
      - task: DownloadPipelineArtifact@2
        displayName: "Download the exact accepted mesh51 add without replaying it"
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          specificBuildWithTriggering: false
          buildVersionToDownload: specific
          pipelineId: 80029
          allowFailedBuilds: true
          artifactName: n100-secondary-capacity-80029-1
          targetPath: $(Pipeline.Workspace)/secondary-capacity-accepted
      - template: /steps/topology/clustermesh-scale/reuse/secondary-capacity.yml
        parameters:
          phase: plan
          scope: ${{ parameters }}
      - task: PublishPipelineArtifact@1
        displayName: "Publish the live capacity-only plan before any pool changes"
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/n100-secondary-capacity/plan.json
          artifact: n100-secondary-capacity-plan-$(Build.BuildId)-$(System.JobAttempt)
      - template: /steps/topology/clustermesh-scale/reuse/secondary-capacity.yml
        parameters:
          phase: execute
          scope: ${{ parameters }}
      - task: PublishPipelineArtifact@1
        displayName: "Publish replacement-capacity receipts without a workload-success claim"
        condition: and(always(), eq(variables['SECONDARY_CAPACITY_DIAGNOSTICS_READY'], 'true'))
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/n100-secondary-capacity
          artifact: n100-secondary-capacity-$(Build.BuildId)-$(System.JobAttempt)
