parameters:
  - name: target_run_id
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: native_build_id
    type: number

steps:
  - script: |
      set -euo pipefail
      umask 077
      if [ "$RUN_ID" != "78751-f36f3d5a" ] ||
        [ "$CONFIRM_RESUME" != "$RUN_ID" ] ||
        [ "$EXPECTED_SUBSCRIPTION_ID" != "37deca37-c375-4a14-b90a-043849bd2bf1" ] ||
        [ "$EXPECTED_REGION" != "eastus2euap" ] ||
        [ "$EXPECTED_CLUSTER_COUNT" != "100" ] ||
        ! [[ "$NATIVE_BUILD_ID" =~ ^[1-9][0-9]*$ ]]; then
        echo "Quota observation requires the exact preserved scope and native-action checkpoint." >&2
        exit 1
      fi
      source="$NATIVE_INPUT_DIRECTORY/recovery.json"
      jq -e '
        .execute == true and .mutation_started == true
        and .original_identity.node_uid == "9d8a9811-0e9a-4ff5-9a94-db89c42d223b"
        and .original_identity.vm_id == "d731b838-501d-438d-a087-fd4545f1d607"
        and .replacement.delete.accepted == true
        and .replacement.delete.ambiguous == false
        and .replacement.native_removal.pool_count == 0
        and .replacement.native_removal.vmss_capacity == 0
        and .replacement.native_removal.old_node_pods_nnc_absent == true
        and .replacement.restore.attempted == true
        and (.error | contains("ErrCode_InsufficientVCPUQuota"))' "$source" >/dev/null
      directory="$ARTIFACT_STAGING_DIRECTORY/n100-unreachable-worker-recovery"
      mkdir -p "$directory"
      echo "##vso[task.setvariable variable=UNREACHABLE_WORKER_DIAGNOSTICS_READY]true"
      cp "$source" "$directory/prior-native-action.json"
      az account show --query '{id:id}' --output json --only-show-errors > "$directory/account.json"
      jq -e --arg id "$EXPECTED_SUBSCRIPTION_ID" '.id == $id' "$directory/account.json" >/dev/null
      az vm list-usage --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --location "$EXPECTED_REGION" --output json --only-show-errors \
        --query '[].{name:name.value,currentValue:currentValue,limit:limit,unit:unit}' \
        > "$directory/regional-usage.json"
      jq 'def counter:
        if type == "number" and . >= 0 and floor == . then .
        elif type == "string" and test("^[0-9]+$") then tonumber
        else error("Quota counters must be nonnegative integers or decimal strings")
        end;
        [.[] | select((.name | ascii_downcase) == "standarddv3family"
        or (.name | ascii_downcase) == "cores"
        or (.name | ascii_downcase) == "standarddsv5family") |
        .limit |= counter | .currentValue |= counter |
        . + {remaining: (.limit - .currentValue)}]' \
        "$directory/regional-usage.json" > "$directory/capacity-quotas.json"
      jq '[.[] | select((.name | ascii_downcase) != "standarddsv5family")]' \
        "$directory/capacity-quotas.json" > "$directory/quota.json"
      jq -e 'length == 2 and all(.[];
        (.limit | type == "number") and (.currentValue | type == "number")
        and .limit >= 0 and .currentValue >= 0)' "$directory/quota.json" >/dev/null
      jq '[.[] | select((.name | ascii_downcase) == "standarddsv5family")]' \
        "$directory/capacity-quotas.json" > "$directory/supported-family-quota.json"
      az vm list-skus --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --location "$EXPECTED_REGION" --resource-type virtualMachines \
        --size Standard_D8s_v5 --all \
        --query "[?name=='Standard_D8s_v5'].{name:name,family:family,locations:locations,capabilities:capabilities,restrictions:restrictions}" \
        --output json --only-show-errors > "$directory/supported-vm-sku.json"
      az group show --subscription "$EXPECTED_SUBSCRIPTION_ID" --name "$RUN_ID" \
        --query '{id:id,name:name,location:location,tags:tags,provisioningState:properties.provisioningState}' \
        --output json --only-show-errors > "$directory/preserved-group.json"
      az aks show --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$RUN_ID" --name clustermesh-96 \
        --query '{id:id,name:name,location:location,nodeResourceGroup:nodeResourceGroup,tags:tags,provisioningState:provisioningState,powerState:powerState}' \
        --output json --only-show-errors > "$directory/cluster.json"
      cluster_id="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$RUN_ID/providers/Microsoft.ContainerService/managedClusters/clustermesh-96"
      if ! jq -e --arg id "$cluster_id" '
        (.id | ascii_downcase) == ($id | ascii_downcase)
        and (.nodeResourceGroup | ascii_downcase) == "mc_78751-f36f3d5a_clustermesh-96_eastus2euap"
        and (.location | ascii_downcase) == "eastus2euap" and .tags.role == "mesh-96"' \
        "$directory/cluster.json" >/dev/null; then
        echo "Observed cluster identity does not match the preserved scope; no worker reads or writes will proceed." >&2
        jq '{id,location,nodeResourceGroup,role:.tags.role}' "$directory/cluster.json" >&2
        exit 1
      fi
      az aks operation show-latest --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$RUN_ID" --name clustermesh-96 \
        --query '{name:name,status:status,operationType:operationType,startTime:startTime,endTime:endTime,errorCode:error.code}' \
        --output json --only-show-errors > "$directory/operation.json"
      az aks nodepool list --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$RUN_ID" --cluster-name clustermesh-96 \
        --query '[].{id:id,name:name,count:count,mode:mode,vmSize:vmSize,nodeImageVersion:nodeImageVersion,provisioningState:provisioningState,powerState:powerState,enableAutoScaling:enableAutoScaling}' \
        --output json --only-show-errors > "$directory/pools.json"
      az aks nodepool list --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$RUN_ID" --cluster-name clustermesh-96 \
        --query '[].{id:id,name:name,count:count,mode:mode,vmSize:vmSize,type:type,nodeImageVersion:nodeImageVersion,orchestratorVersion:orchestratorVersion,osSku:not_null(osSku,osSKU),osType:osType,osDiskType:osDiskType,osDiskSizeGb:not_null(osDiskSizeGb,osDiskSizeGB),kubeletDiskType:kubeletDiskType,maxPods:maxPods,vnetSubnetId:not_null(vnetSubnetId,vnetSubnetID),podSubnetId:not_null(podSubnetId,podSubnetID),nodeLabels:nodeLabels,nodeTaints:nodeTaints,availabilityZones:availabilityZones,kubeletConfig:kubeletConfig,linuxOsConfig:linuxOsConfig,enableFips:enableFips,enableEncryptionAtHost:enableEncryptionAtHost,enableNodePublicIp:enableNodePublicIp,enableAutoScaling:enableAutoScaling,upgradeSettings:upgradeSettings,provisioningState:provisioningState,powerState:powerState}' \
        --output json --only-show-errors > "$directory/pool-configuration.json"
      node_group="mc_78751-f36f3d5a_clustermesh-96_eastus2euap"
      az vmss list --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$node_group" \
        --query '[].{id:id,name:name,capacity:sku.capacity,sku:sku.name,provisioningState:provisioningState}' \
        --output json --only-show-errors > "$directory/vmsses.json"
      az vmss list-instances --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$node_group" --name aks-prompool-38822163-vmss \
        --query '[].{id:id,instanceId:instanceId,vmId:vmId,computerName:osProfile.computerName,provisioningState:provisioningState}' \
        --output json --only-show-errors > "$directory/prom-instances.json"
      az vmss list-instances --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$node_group" --name aks-default-28928250-vmss \
        --query '[].{id:id,instanceId:instanceId,vmId:vmId,computerName:osProfile.computerName,provisioningState:provisioningState}' \
        --output json --only-show-errors > "$directory/default-instances.json"
      for instance in 0 1; do
        timeout 60 az vmss get-instance-view --subscription "$EXPECTED_SUBSCRIPTION_ID" \
          --resource-group "$node_group" --name aks-default-28928250-vmss --instance-id "$instance" \
          --query '{statuses:statuses,vmAgent:vmAgent,maintenanceRedeployStatus:maintenanceRedeployStatus,extensions:extensions[].{name:name,statuses:statuses}}' \
          --output json --only-show-errors > "$directory/default-$instance-instance-view.json"
      done
      private=$(mktemp -d "$AGENT_TEMP_DIRECTORY/native-worker-observe.XXXXXX")
      cleanup() {
        rm -f -- "$private/cluster.config"
        rmdir -- "$private"
      }
      trap cleanup EXIT
      timeout 90 az aks get-credentials --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$RUN_ID" --name clustermesh-96 --context clustermesh-96 \
        --file "$private/cluster.config" --only-show-errors
      chmod 600 "$private/cluster.config"
      kube=(kubectl --kubeconfig "$private/cluster.config" --context clustermesh-96 --request-timeout=20s)
      for resource in nodes pods events; do
        timeout 45 "${kube[@]}" get "$resource" -A -o json > "$directory/current-$resource.json"
      done
      timeout 45 "${kube[@]}" get deployments,replicasets,daemonsets,statefulsets -A -o json \
        > "$directory/current-controllers.json"
      timeout 45 "${kube[@]}" get pdb -A -o json > "$directory/current-pdbs.json"
      timeout 45 "${kube[@]}" get nodenetworkconfigs -n kube-system -o json > "$directory/current-nnc.json"
      timeout 45 "${kube[@]}" get configmap kwok -n kube-system -o json > "$directory/kwok-config.json"
      timeout 45 "${kube[@]}" get stages -o json > "$directory/kwok-stages.json"
      timeout 45 "${kube[@]}" get leases -n kube-node-lease -o json > "$directory/kwok-node-leases.json"
      timeout 45 "${kube[@]}" get leases -n kube-system -o json > "$directory/kwok-controller-leases.json"
      kwok_pod=$(jq -er '
        [.items[] | select(.metadata.namespace == "kube-system"
          and .metadata.deletionTimestamp == null and .status.phase == "Running"
          and any(.status.conditions[]?; .type == "Ready" and .status == "True")
          and any(.metadata.ownerReferences[]?;
            .controller == true and .kind == "ReplicaSet"
            and .uid == "831a12f2-434d-4920-ab4c-d5072a2bf2aa"))] |
        if length == 1 then .[0].metadata.name
        else error("No single Ready controller-owned KWOK Pod is available for bounded logs")
        end' "$directory/current-pods.json")
      if ! [[ "$kwok_pod" =~ ^kwok-controller-[a-z0-9-]+$ ]]; then
        echo "Unexpected KWOK Pod name; no log lookup is authorized." >&2
        exit 1
      fi
      timeout 45 "${kube[@]}" logs "$kwok_pod" -n kube-system --timestamps --tail=200 --since=2h \
        > "$directory/kwok-controller.log"
      if jq -e 'any(.[]; .name == "cniv5")' "$directory/pools.json" >/dev/null; then
        modern_vmss="aks-cniv5-27550670-vmss"
        modern_vmss_seen=false
        timeout 60 az group show --subscription "$EXPECTED_SUBSCRIPTION_ID" --name "$node_group" \
          --query '{id:id,managedBy:managedBy,location:location,tags:tags}' \
          --output json --only-show-errors > "$directory/cniv5-node-group.json"
        timeout 60 az aks operation show-latest --subscription "$EXPECTED_SUBSCRIPTION_ID" \
          --resource-group "$RUN_ID" --name clustermesh-96 --nodepool-name cniv5 \
          --query '{name:name,status:status,operationType:operationType,startTime:startTime,endTime:endTime,errorCode:error.code}' \
          --output json --only-show-errors > "$directory/cniv5-operation.json"
        timeout 45 "${kube[@]}" get configmap mesh96-capacity-first-cniv5 -n kube-system -o json \
          > "$directory/cniv5-capacity-journal.json"
        if jq -e --arg name "$modern_vmss" 'any(.[]; .name == $name)' "$directory/vmsses.json" >/dev/null; then
          modern_vmss_seen=true
          timeout 60 az vmss show --subscription "$EXPECTED_SUBSCRIPTION_ID" \
            --resource-group "$node_group" --name "$modern_vmss" \
            --query '{id:id,name:name,location:location,sku:sku,tags:tags,orchestrationMode:orchestrationMode,provisioningState:provisioningState,osDisk:virtualMachineProfile.storageProfile.osDisk,imageReference:virtualMachineProfile.storageProfile.imageReference}' \
            --output json --only-show-errors > "$directory/cniv5-vmss-model.json"
          timeout 60 az vmss list-instances --subscription "$EXPECTED_SUBSCRIPTION_ID" \
            --resource-group "$node_group" --name "$modern_vmss" \
            --query '[].{id:id,instanceId:instanceId,vmId:vmId,computerName:osProfile.computerName,latestModelApplied:latestModelApplied,provisioningState:provisioningState}' \
            --output json --only-show-errors > "$directory/cniv5-instances.json"
          jq -e 'length <= 2 and all(.[]; .instanceId == "0" or .instanceId == "1")' \
            "$directory/cniv5-instances.json" >/dev/null
          timeout 60 az vmss get-instance-view --subscription "$EXPECTED_SUBSCRIPTION_ID" \
            --resource-group "$node_group" --name "$modern_vmss" \
            --query '{statuses:statuses,virtualMachines:virtualMachine.statusesSummary}' \
            --output json --only-show-errors > "$directory/cniv5-vmss-instance-view.json"
          mapfile -t modern_instances < <(jq -r '.[].instanceId' "$directory/cniv5-instances.json")
          for instance in "${modern_instances[@]}"; do
            timeout 60 az vmss get-instance-view --subscription "$EXPECTED_SUBSCRIPTION_ID" \
              --resource-group "$node_group" --name "$modern_vmss" --instance-id "$instance" \
              --query '{statuses:statuses,vmAgent:vmAgent,extensions:extensions[].{name:name,statuses:statuses}}' \
              --output json --only-show-errors > "$directory/cniv5-$instance-instance-view.json"
          done
        fi
        jq -n --argjson vmss_seen "$modern_vmss_seen" \
          '{observation_only:true,mutation_started:false,pool_seen:true,vmss_seen:$vmss_seen,
            creation_receipt_reference_build:79971,registered_nodes_ready:false,workloads_ready:false,
            note:"Raw observation of the existing accepted creation, not a new request or readiness qualification"}' \
          > "$directory/cniv5-observation.json"
      fi
      timeout 60 az vmss get-instance-view --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-group "$node_group" --name aks-default-28928250-vmss \
        --query '{statuses:statuses,virtualMachines:virtualMachine.statusesSummary}' \
        --output json --only-show-errors > "$directory/default-vmss-instance-view.json"
      vmss_id="/subscriptions/$EXPECTED_SUBSCRIPTION_ID/resourceGroups/$node_group/providers/Microsoft.Compute/virtualMachineScaleSets/aks-default-28928250-vmss"
      timeout 90 az monitor activity-log list --subscription "$EXPECTED_SUBSCRIPTION_ID" \
        --resource-id "$vmss_id" --offset 2h --max-events 100 \
        --query '[].{eventTimestamp:eventTimestamp,submissionTimestamp:submissionTimestamp,operation:operationName.value,status:status.value,subStatus:subStatus.value,resourceId:resourceId,correlationId:correlationId,operationId:operationId,eventDataId:eventDataId,level:level,properties:properties}' \
        --output json --only-show-errors > "$directory/default-vmss-activity-log.json"
      jq -n '{supported:false,queried:false,provider_error:"UnsupportedResourceType",
        evidence_build:79941,reason:"Resource Health does not support this Uniform VMSS instance type",
        worker_health_inferred:false}' > "$directory/default-1-resource-health.json"
      accidental_group="79825-24946a3a"
      if az group show --subscription "$EXPECTED_SUBSCRIPTION_ID" --name "$accidental_group" \
        --query '{id:id,name:name,location:location,tags:tags,provisioningState:properties.provisioningState}' \
        --output json --only-show-errors > "$directory/accidental-group.json" \
        2> "$directory/accidental-group-read.log"; then
        az aks list --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$accidental_group" \
          --query '[].{id:id,name:name,location:location,nodeResourceGroup:nodeResourceGroup,tags:tags,provisioningState:provisioningState,powerState:powerState}' \
          --output json --only-show-errors > "$directory/accidental-clusters.json"
        while IFS=$'\t' read -r name managed_group; do
          if ! [[ "$name" =~ ^clustermesh-[12]$ ]] ||
            [ "${managed_group,,}" != "mc_${accidental_group}_${name}_eastus2euap" ]; then
            echo "Unexpected accidental-run cluster identity; no wider discovery is permitted." >&2
            exit 1
          fi
          if az group show --subscription "$EXPECTED_SUBSCRIPTION_ID" --name "$managed_group" \
            --query '{id:id,name:name,managedBy:managedBy,location:location,provisioningState:properties.provisioningState}' \
            --output json --only-show-errors > "$directory/accidental-$name-node-group.json" \
            2> "$directory/accidental-$name-node-group-read.log"; then
            az vmss list --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$managed_group" \
              --query '[].{id:id,name:name,capacity:sku.capacity,sku:sku.name,provisioningState:provisioningState}' \
              --output json --only-show-errors > "$directory/accidental-$name-vmsses.json"
          elif grep -q '(ResourceGroupNotFound)' "$directory/accidental-$name-node-group-read.log"; then
            jq -n --arg group "$managed_group" \
              '{name:$group,absent:true,proof:"ResourceGroupNotFound"}' \
              > "$directory/accidental-$name-node-group.json"
          else
            echo "Managed-group read failed; absence is not proved." >&2
            exit 1
          fi
        done < <(jq -r '.[] | [.name, .nodeResourceGroup] | @tsv' "$directory/accidental-clusters.json")
      elif grep -q '(ResourceGroupNotFound)' "$directory/accidental-group-read.log"; then
        jq -n --arg group "$accidental_group" \
          '{name:$group,absent:true,proof:"ResourceGroupNotFound"}' > "$directory/accidental-group.json"
      else
        echo "Accidental-group read failed; absence is not proved. No resource writes were attempted." >&2
        exit 1
      fi
      jq -n --argjson build "$NATIVE_BUILD_ID" \
        --slurpfile quota "$directory/quota.json" \
        --slurpfile pools "$directory/pools.json" --slurpfile instances "$directory/prom-instances.json" \
        '{observation_only:true,mutation_started:false,workloads_ready:false,
          source_native_build:$build,observation_complete:true,
          worker_state_collected:true,resource_health_complete:false,resource_health_supported:false,quota:$quota[0],
          headroom_for_restore:(all($quota[0][]; .remaining >= 8)),
          headroom_for_restore_and_cni:(all($quota[0][]; .remaining >= 24)),
          pools:$pools[0],prom_instances:$instances[0]}' > "$directory/quota-observation.json"
      echo "Resource Health is unsupported for this instance type; no health result is inferred from that gap."
      echo "Completed read-only native-outcome and quota observation; no repair or cleanup was submitted."
    displayName: "Observe worker maintenance, native outcome and quota without changes"
    retryCountOnTaskFailure: 0
    env:
      RUN_ID: ${{ parameters.target_run_id }}
      CONFIRM_RESUME: $(CLUSTERMESH_DEBUG_CONFIRM_RESUME)
      EXPECTED_SUBSCRIPTION_ID: ${{ parameters.expected_subscription_id }}
      EXPECTED_REGION: ${{ parameters.expected_region }}
      EXPECTED_CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      NATIVE_BUILD_ID: "${{ parameters.native_build_id }}"
      NATIVE_INPUT_DIRECTORY: $(Pipeline.Workspace)/native-host-action-${{ parameters.native_build_id }}
      ARTIFACT_STAGING_DIRECTORY: $(Build.ArtifactStagingDirectory)
      AGENT_TEMP_DIRECTORY: $(Agent.TempDirectory)

  - task: PublishPipelineArtifact@1
    displayName: "Publish read-only quota and native-outcome evidence"
    condition: >-
      and(always(),
      eq(variables['UNREACHABLE_WORKER_DIAGNOSTICS_READY'], 'true'))
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/n100-unreachable-worker-recovery"
      artifact: "n100-unreachable-worker-recovery-$(Build.BuildId)-$(System.JobAttempt)"
