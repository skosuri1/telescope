parameters:
  - name: target_run_id
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: retirement_role
    type: string
  - name: retirement_node
    type: string
  - name: retirement_uid
    type: string

steps:
  - script: |
      set -euo pipefail
      if [ -z "$RETIREMENT_ROLE" ] &&
        [ -z "$RETIREMENT_NODE" ] &&
        [ -z "$RETIREMENT_UID" ]; then
        echo "No prepared worker retirement requested."
        exit 0
      fi
      if [ -z "$RETIREMENT_ROLE" ] ||
        [ -z "$RETIREMENT_NODE" ] ||
        [ -z "$RETIREMENT_UID" ]; then
        echo "Prepared worker retirement requires role, node name, and UID." >&2
        exit 1
      fi
      if [ "$EXPECTED_CLUSTER_COUNT" != "100" ]; then
        echo "Prepared worker retirement is restricted to the preserved n100 inventory." >&2
        exit 1
      fi
      if [ "$CONFIRM_RESUME" != "$RUN_ID" ]; then
        echo "Prepared retirement requires the exact preserved resume confirmation." >&2
        exit 1
      fi
      summary_dir="$(Build.ArtifactStagingDirectory)/n100-prepared-worker-retirement"
      mkdir -p "$summary_dir"
      echo "##vso[task.setvariable variable=PREPARED_WORKER_RETIREMENT_DIAGNOSTICS_READY]true"
      expected_tfvars_sha=$(sha256sum \
        "$(Pipeline.Workspace)/s/${{ parameters.tfvars_path }}" | awk '{print $1}')
      python3 "$(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/prepared_worker_retirement.py" \
        --resource-group "$RUN_ID" \
        --confirm-resource-group "$CONFIRM_RESUME" \
        --expected-subscription "${{ parameters.expected_subscription_id }}" \
        --expected-region "${{ parameters.expected_region }}" \
        --expected-tfvars-sha "$expected_tfvars_sha" \
        --role "$RETIREMENT_ROLE" \
        --node-name "$RETIREMENT_NODE" \
        --node-uid "$RETIREMENT_UID" \
        --summary-file "$summary_dir/retirement.json" \
        --execute
    displayName: "Finish explicitly prepared worker retirement"
    env:
      RUN_ID: ${{ parameters.target_run_id }}
      EXPECTED_CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      CONFIRM_RESUME: $(CLUSTERMESH_DEBUG_CONFIRM_RESUME)
      RETIREMENT_ROLE: ${{ parameters.retirement_role }}
      RETIREMENT_NODE: ${{ parameters.retirement_node }}
      RETIREMENT_UID: ${{ parameters.retirement_uid }}

  - task: PublishPipelineArtifact@1
    displayName: "Publish prepared worker retirement diagnostics"
    condition: >-
      and(succeededOrFailed(),
      eq(variables['PREPARED_WORKER_RETIREMENT_DIAGNOSTICS_READY'], 'true'))
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/n100-prepared-worker-retirement"
      artifact: "n100-prepared-worker-retirement-$(Build.BuildId)-$(System.JobAttempt)"
