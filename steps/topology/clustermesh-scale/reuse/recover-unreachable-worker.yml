parameters:
  - name: target_run_id
    type: string
  - name: expected_subscription_id
    type: string
  - name: expected_region
    type: string
  - name: expected_cluster_count
    type: number
  - name: tfvars_path
    type: string
  - name: plan_json
    type: string
  - name: reimage_failed_os
    type: boolean
    default: false
  - name: observe_build_id
    type: number
    default: 0
  - name: replace_failed_host_build_id
    type: number
    default: 0
  - name: resume_replacement_build_id
    type: number
    default: 0

steps:
  - script: |
      set -euo pipefail
      umask 077
      replace_build_id="${REPLACE_FAILED_HOST_BUILD_ID:-0}"
      if [ "$EXPECTED_CLUSTER_COUNT" != "100" ] ||
        [ "$CONFIRM_RESUME" != "$RUN_ID" ] ||
        ! [[ "$RUN_ID" =~ ^[0-9]+-[0-9a-f]{8}$ ]] ||
        ! [[ "$replace_build_id" =~ ^(0|[1-9][0-9]*)$ ]] ||
        { [ -z "$RECOVERY_PLAN_JSON" ] && [ "$replace_build_id" = "0" ]; } ||
        [ "${#RECOVERY_PLAN_JSON}" -gt 32768 ]; then
        echo "Unreachable-worker recovery requires confirmed preserved n100 scope and an explicit bounded plan." >&2
        exit 1
      fi
      summary_dir="$(Build.ArtifactStagingDirectory)/n100-unreachable-worker-recovery"
      mkdir -p "$summary_dir"
      echo "##vso[task.setvariable variable=UNREACHABLE_WORKER_DIAGNOSTICS_READY]true"
      if [ -n "$RECOVERY_PLAN_JSON" ]; then
        printf '%s\n' "$RECOVERY_PLAN_JSON" > "$summary_dir/input-plan.json"
      else
        original_plan="$(Pipeline.Workspace)/accepted-failed-host-$replace_build_id/input-plan.json"
        if [ ! -s "$original_plan" ] || [ "$(wc -c < "$original_plan")" -gt 32769 ]; then
          echo "The bounded original identity plan is missing from the accepted-action artifact." >&2
          exit 1
        fi
        cp "$original_plan" "$summary_dir/input-plan.json"
      fi
      jq -e 'type == "object" and .schema_version == 1' \
        "$summary_dir/input-plan.json" >/dev/null
      plan_sha=$(sha256sum "$summary_dir/input-plan.json" | awk '{print $1}')
      expected_tfvars_sha=$(sha256sum \
        "$(Pipeline.Workspace)/s/${{ parameters.tfvars_path }}" | awk '{print $1}')
      helper="$(Pipeline.Workspace)/s/modules/python/clusterloader2/clustermesh-scale/unreachable_prom_worker_recovery.py"
      args=(
        --resource-group "$RUN_ID"
        --confirm-resource-group "$CONFIRM_RESUME"
        --expected-subscription "${{ parameters.expected_subscription_id }}"
        --expected-region "${{ parameters.expected_region }}"
        --expected-tfvars-sha "$expected_tfvars_sha"
        --plan-file "$summary_dir/input-plan.json"
      )
      reimage_failed_os="${REIMAGE_FAILED_OS:-false}"
      case "${reimage_failed_os,,}" in
        true) args+=(--reimage-failed-os) ;;
        false) ;;
        *) echo "REIMAGE_FAILED_OS must be true or false." >&2; exit 1 ;;
      esac
      observe_build_id="${OBSERVE_BUILD_ID:-0}"
      if ! [[ "$observe_build_id" =~ ^(0|[1-9][0-9]*)$ ]]; then
        echo "OBSERVE_BUILD_ID must be a canonical non-negative integer." >&2
        exit 1
      fi
      if ! [[ "$replace_build_id" =~ ^(0|[1-9][0-9]*)$ ]] ||
        { [ "$replace_build_id" != "0" ] &&
          { [ "$observe_build_id" != "0" ] || [ "${reimage_failed_os,,}" != "false" ]; }; }; then
        echo "Failed-host replacement must have its own source build and no observer/reimage mode." >&2
        exit 1
      fi
      timeout_seconds=1800
      accepted_sha=""
      native_sha=""
      if [ "$replace_build_id" != "0" ]; then
        accepted="$(Pipeline.Workspace)/accepted-failed-host-$replace_build_id/recovery.json"
        if [ ! -s "$accepted" ]; then
          echo "The exact accepted-action lineage is required before failed-host replacement." >&2
          exit 1
        fi
        cp "$accepted" "$summary_dir/accepted-action.json"
        accepted_sha=$(sha256sum "$summary_dir/accepted-action.json" | awk '{print $1}')
        args+=(--replace-failed-host "$summary_dir/accepted-action.json")
        timeout_seconds=3600
      fi
      resume_build_id="${RESUME_REPLACEMENT_BUILD_ID:-0}"
      if ! [[ "$resume_build_id" =~ ^(0|[1-9][0-9]*)$ ]] ||
        { [ "$resume_build_id" != "0" ] && [ "$replace_build_id" = "0" ]; }; then
        echo "Capacity continuation requires a canonical native checkpoint and original accepted-action source." >&2
        exit 1
      fi
      if [ "$resume_build_id" != "0" ]; then
        native="$(Pipeline.Workspace)/native-host-action-$resume_build_id/recovery.json"
        if [ ! -s "$native" ]; then
          echo "The native removal/restoration outcome is required for capacity continuation." >&2
          exit 1
        fi
        cp "$native" "$summary_dir/native-action.json"
        native_sha=$(sha256sum "$summary_dir/native-action.json" | awk '{print $1}')
        args+=(--resume-replacement "$summary_dir/native-action.json")
      fi
      args+=(--timeout-seconds "$timeout_seconds")
      if [ "$observe_build_id" != "0" ]; then
        accepted="$(Pipeline.Workspace)/accepted-host-action-$observe_build_id/recovery.json"
        if [ "${reimage_failed_os,,}" != "true" ] || [ ! -s "$accepted" ]; then
          echo "The accepted OS-action receipt is required for read-only observation." >&2
          exit 1
        fi
        echo "Read-only observation of the accepted host action from build $observe_build_id; no mutation path will run."
        cp "$accepted" "$summary_dir/accepted-action.json"
        python3 "$helper" "${args[@]}" \
          --observe-accepted-action "$summary_dir/accepted-action.json" \
          --summary-file "$summary_dir/observation.json"
        exit 0
      fi
      python3 "$helper" "${args[@]}" \
        --summary-file "$summary_dir/plan-only.json"
      jq -e '.execute == false and .mutation_started == false
        and (.plan_valid == true or .success == true)' \
        "$summary_dir/plan-only.json" >/dev/null
      if [ "$(sha256sum "$summary_dir/input-plan.json" | awk '{print $1}')" != "$plan_sha" ]; then
        echo "The explicit recovery plan changed during read-only planning." >&2
        exit 1
      fi
      if [ -n "$accepted_sha" ] &&
        [ "$(sha256sum "$summary_dir/accepted-action.json" | awk '{print $1}')" != "$accepted_sha" ]; then
        echo "The accepted-action lineage changed during read-only planning." >&2
        exit 1
      fi
      if [ -n "$native_sha" ] &&
        [ "$(sha256sum "$summary_dir/native-action.json" | awk '{print $1}')" != "$native_sha" ]; then
        echo "The native-action checkpoint changed during read-only planning." >&2
        exit 1
      fi
      python3 "$helper" "${args[@]}" \
        --summary-file "$summary_dir/recovery.json" --execute
    displayName: "Plan then recover the exact unreachable worker and failed framework pods"
    retryCountOnTaskFailure: 0
    env:
      RUN_ID: ${{ parameters.target_run_id }}
      CONFIRM_RESUME: $(CLUSTERMESH_DEBUG_CONFIRM_RESUME)
      EXPECTED_CLUSTER_COUNT: "${{ parameters.expected_cluster_count }}"
      RECOVERY_PLAN_JSON: ${{ parameters.plan_json }}
      REIMAGE_FAILED_OS: "${{ parameters.reimage_failed_os }}"
      OBSERVE_BUILD_ID: "${{ parameters.observe_build_id }}"
      REPLACE_FAILED_HOST_BUILD_ID: "${{ parameters.replace_failed_host_build_id }}"
      RESUME_REPLACEMENT_BUILD_ID: "${{ parameters.resume_replacement_build_id }}"

  - task: PublishPipelineArtifact@1
    displayName: "Publish unreachable-worker recovery evidence"
    condition: >-
      and(always(),
      eq(variables['UNREACHABLE_WORKER_DIAGNOSTICS_READY'], 'true'))
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/n100-unreachable-worker-recovery"
      artifact: "n100-unreachable-worker-recovery-$(Build.BuildId)-$(System.JobAttempt)"
